name: Validar contexto compartido
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contexto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar documentos y enlaces locales
        run: python scripts/validar_contexto.py
      - name: Verificar espacios en el diff
        run: git diff --check
