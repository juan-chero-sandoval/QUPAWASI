name: qupa_wasi
description: "Q'UPA WASI - prototipo offline de reciclaje UNP"
publish_to: 'none'

# versionName+versionCode de Android.
version: 0.2.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  drift: ^2.35.3
  sqlite3: ^3.8.0
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Almacén en memoria para probar SharedPreferencesAsync sin plugin nativo.
  shared_preferences_platform_interface: ^2.4.2
  drift_dev: ^2.35.2
  build_runner: ^2.16.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
